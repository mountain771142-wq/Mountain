<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your ticket</title>
    <!-- مكتبة الـ QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ededed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 0;
        }

        /* حاوية الهاتف الرئيسية */
        .app-container {
            width: 100%;
            max-width: 412px;
            background: #ededed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 1. الهيدر العلوي الثابت */
        .top-header {
            background: #ffffff;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .top-header .title {
            font-size: 19px;
            font-weight: 800;
            color: #111111;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            letter-spacing: -0.2px;
        }

        .top-header .close-btn {
            font-size: 17px;
            font-weight: 500;
            color: #4a4a4a;
            cursor: pointer;
            margin-left: auto;
        }

        /* 2. جسم التذكرة */
        .ticket-wrapper {
            padding: 16px;
            flex: 1;
        }

        .ticket-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            position: relative;
        }

        /* الشريط الداكن العلوي للتذكرة */
        .card-top-bar {
            background-color: #2f3843;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f5ca38;
            font-size: 16px;
            font-weight: 700;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* منطقة الـ QR Code */
        .qr-wrapper {
            background: #ffffff;
            padding: 35px 20px 25px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        #qrcode img {
            display: block;
            opacity: 0.25; /* جعل الكود ضبابي كالموجود بالصورة لحفظ الخصوصية */
            filter: blur(2px);
        }

        /* كبسولة Expired الحمراء */
        .expired-badge {
            background-color: #fce8e8;
            border-radius: 10px;
            margin: 10px 16px 20px 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .expired-badge .x-icon {
            width: 18px;
            height: 18px;
            background-color: #c81e1e;
            border-radius: 50%;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            line-height: 1;
        }

        .expired-badge span {
            color: #c81e1e;
            font-size: 15px;
            font-weight: 700;
        }

        /* الفاصل الجانبي الدائري (Notches) */
        .ticket-divider {
            position: relative;
            height: 24px;
            background: #ffffff;
            display: flex;
            align-items: center;
        }

        .divider-line {
            width: 100%;
            border-bottom: 1px solid #f0f0f0;
        }

        .notch {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ededed;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        .notch-left { left: -10px; }
        .notch-right { right: -10px; }

        /* تفاصيل التذكرة */
        .ticket-content {
            padding: 22px 18px 25px 18px;
            background: #ffffff;
        }

        .ticket-title {
            font-size: 22px;
            font-weight: 800;
            color: #111111;
            margin-bottom: 18px;
            letter-spacing: -0.3px;
        }

        .provider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .check-icon {
            width: 20px;
            height: 20px;
            background-color: #222222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
        }

        .provider-name {
            font-size: 15px;
            font-weight: 600;
            color: #222222;
        }

        /* قسم View Details Accordion */
        .details-accordion {
            border-top: 1px solid #efefef;
            padding-top: 16px;
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .accordion-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-icon {
            width: 22px;
            height: 22px;
            border: 1.8px solid #222222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            font-family: Georgia, serif;
            color: #222222;
        }

        .accordion-label {
            font-size: 16px;
            font-weight: 600;
            color: #222222;
        }

        .arrow-up {
            width: 10px;
            height: 10px;
            border-left: 2px solid #222222;
            border-top: 2px solid #222222;
            transform: rotate(45deg);
            margin-top: 4px;
        }

        /* تفاصيل الصلاحية */
        .validity-box {
            margin-top: 22px;
        }

        .validity-heading {
            font-size: 16px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 6px;
        }

        .validity-text {
            font-size: 14px;
            color: #4a4a4a;
            line-height: 1.45;
            font-weight: 400;
        }

        /* شريط الجوال السفلي (Home Indicator) */
        .home-bar {
            width: 134px;
            height: 5px;
            background-color: #111111;
            border-radius: 3px;
            margin: 15px auto 8px auto;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 1. الهيدر -->
        <div class="top-header">
            <div class="title">Your ticket</div>
            <div class="close-btn">Close</div>
        </div>

        <!-- 2. كارت التذكرة -->
        <div class="ticket-wrapper">
            <div class="ticket-card">
                
                <!-- الشريط العلوي الداكن -->
                <div class="card-top-bar">
                    <div class="bar-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="#f5ca38">
                            <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
                        </svg>
                        <span>Bus</span>
                    </div>
                    <div class="bar-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="#f5ca38">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        <span>Adult</span>
                    </div>
                </div>

                <!-- الـ QR Code -->
                <div class="qr-wrapper">
                    <div id="qrcode"></div>
                </div>

                <!-- شريط Expired الاحمر -->
                <div class="expired-badge">
                    <div class="x-icon">&#10005;</div>
                    <span>Expired</span>
                </div>

                <!-- الفاصل الجانبي الدائري -->
                <div class="ticket-divider">
                    <div class="notch notch-left"></div>
                    <div class="divider-line"></div>
                    <div class="notch notch-right"></div>
                </div>

                <!-- التفاصيل -->
                <div class="ticket-content">
                    <div class="ticket-title">1-day Bee Bus</div>

                    <div class="provider-row">
                        <div class="check-icon">&#10003;</div>
                        <div class="provider-name">Bee Network</div>
                    </div>

                    <div class="details-accordion">
                        <div class="accordion-header">
                            <div class="accordion-title-group">
                                <div class="info-icon">i</div>
                                <div class="accordion-label">View details</div>
                            </div>
                            <div class="arrow-up"></div>
                        </div>

                        <div class="validity-box">
                            <div class="validity-heading">Validity</div>
                            <div class="validity-text">
                                Your ticket was valid for travel until 7 August 2026 at 3:59am.
                            </div>
                        </div>
                    </div>

                </div>

            </div>
            
            <div class="home-bar"></div>
        </div>
    </div>

    <script>
        // توليد رمز QR وهمي مطابق للصورة
        new QRCode(document.getElementById("qrcode"), {
            text: "https://beenetwork.com/ticket/expired-78812",
            width: 170,
            height: 170,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });
    </script>
</body>
</html>
